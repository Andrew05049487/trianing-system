spring.datasource.url=${DB_URL}

spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.datasource.username=${DB_USERNAME}

spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

spring.jpa.open-in-view=false

spring.sql.init.mode=never

server.error.include-message=always

server.error.include-binding-errors=always

server.port=${PORT:8080}

# HMAC key used only to authenticate the MVP Custom Exercise API identity.
# Configure CUSTOM_EXERCISE_IDENTITY_SECRET on Render; never put its value in code.
custom.exercise.identity-secret=${CUSTOM_EXERCISE_IDENTITY_SECRET:}

logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=TRACE
