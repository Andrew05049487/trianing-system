spring.datasource.url=${DB_URL}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.username=${DB_USERNAME}

spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.data-source-properties.tinyInt1isBit=false
spring.datasource.hikari.data-source-properties.useServerPrepStmts=true

spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=false

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP
spring.jpa.properties.hibernate.type.preferred_boolean_jdbc_type=TINYINT

spring.jpa.open-in-view=false
research.collection-enabled=${RESEARCH_COLLECTION_ENABLED:false}
research.consent-version=${RESEARCH_CONSENT_VERSION:}
research.hand-consent-version=${RESEARCH_HAND_CONSENT_VERSION:}

spring.sql.init.mode=never

server.error.include-message=always

server.error.include-binding-errors=always

server.port=${PORT:8080}

spring.servlet.multipart.max-file-size=${MAX_VIDEO_FILE_SIZE:32MB}
spring.servlet.multipart.max-request-size=${MAX_VIDEO_REQUEST_SIZE:33MB}
training.history.video.max-bytes=${MAX_VIDEO_BYTES:33554432}

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force-response=true

logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=TRACE
